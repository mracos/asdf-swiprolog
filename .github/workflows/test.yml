name: test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # "At 09:17 on Monday." The regression suite stubs curl/cmake/make against
    # fixture snapshots, so it cannot see upstream drift: bin/list-all scrapes
    # swi-prolog.org and bin/install builds whatever tarball that page points
    # at. The weekly integration run is the only thing that would notice the
    # page changing shape or the newest release failing to compile. Odd minute
    # dodges top-of-hour runner congestion.
    - cron: "17 9 * * 1"

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x -S error bin/install bin/list-all bin/latest-stable test/helpers.bash

  test:
    name: regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        # macOS ships bash 3.2, and it is the platform most of the
        # dependency notes target, so it gets its own leg.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node_modules (bats)
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bats-${{ matrix.os }}-${{ hashFiles('package.json') }}

      - name: Install bats
        run: npm install --no-save bats@1.11.0

      - name: bash version
        run: bash --version | head -1

      # The suite is hermetic: curl/cmake/make/tar are stubbed, so it needs
      # no network and no toolchain.
      - name: Regression tests
        run: ./node_modules/.bin/bats test/regression

  # Real end-to-end build via mise: resolves latest-stable off the live
  # download page and compiles it. ASDF_SWIPROLOG_RUN_INTEGRATION keeps the
  # suite inert outside CI; here it always runs, and the weekly cron covers
  # the stretches where nobody pushes.
  integration:
    name: integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      ASDF_SWIPROLOG_RUN_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # bin/install leaves SWIPL_PACKAGES_JAVA and the GUI package OFF unless
      # asked, so no JDK and no X11 here. The rest is SWI-Prolog's documented
      # core build set.
      - name: Install build deps (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libgmp-dev libssl-dev zlib1g-dev libreadline-dev libedit-dev \
            libarchive-dev libossp-uuid-dev libpcre2-dev libyaml-dev \
            libdb-dev unixodbc-dev

      # bin/install passes -DMACOSX_DEPENDENCIES_FROM=Homebrew when brew is on
      # PATH, so cmake resolves these under the brew prefix.
      - name: Install build deps (macos)
        if: runner.os == 'macOS'
        run: brew install cmake gmp openssl@3 libarchive pcre2 libyaml readline

      - name: Install mise
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"

      - name: Install bats
        run: npm install --no-save bats@1.11.0

      - name: Integration tests
        run: ./node_modules/.bin/bats test/integration
        timeout-minutes: 60
