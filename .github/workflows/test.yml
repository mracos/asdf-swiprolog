name: test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x -S error bin/install bin/list-all bin/latest-stable test/helpers.bash

  test:
    name: regression
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node_modules (bats)
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bats-${{ hashFiles('package.json') }}

      - name: Install bats
        run: npm install --no-save bats@1.11.0

      # The suite is hermetic: curl/cmake/make/tar are stubbed, so it needs
      # no network and no toolchain.
      - name: Regression tests
        run: ./node_modules/.bin/bats test/regression
